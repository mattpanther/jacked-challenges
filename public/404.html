<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Jacked Challenges</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Encodes the path into the query string so index.html can redirect properly
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
